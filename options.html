<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>GitHub PR AI Summarizer Options</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
      }

      input[type="text"],
      input[type="password"],
      input[type="number"],
      select {
        width: 100%;
        padding: 8px;
        margin-bottom: 12px;
      }

      button {
        padding: 8px 16px;
      }

      #status {
        margin-top: 12px;
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>Extension Options</h1>
    <label for="apiKey">OpenAI API Key:</label>
    <input
      type="password"
      id="apiKey"
      placeholder="Enter your OpenAI API key"
    />
    <label for="githubToken">GitHub Personal Access Token:</label>
    <input
      type="password"
      id="githubToken"
      placeholder="Enter your GitHub personal access token"
    />
    <label for="model">OpenAI model:</label>
    <select id="model">
      <option value="gpt-5.6-sol">GPT-5.6 Sol — highest capability</option>
      <option value="gpt-5.6-terra">GPT-5.6 Terra — balanced capability and cost</option>
      <option value="gpt-5.6-luna">GPT-5.6 Luna — cost-efficient</option>
    </select>
    <label for="maxTokens">Maximum output tokens:</label>
    <input
      type="number"
      id="maxTokens"
      min="1"
      step="1"
      placeholder="700"
    />
    <button id="save">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
